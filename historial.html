<!-- ============================================================================
     LIVES · SESIÓN DEL PORTAL EN LAS HERRAMIENTAS            lives-sesion v5.2 · 2026-10-06
     Bloque común: es idéntico en todas las herramientas. Si se corrige, se corrige en
     todas. No depende de nada de la página.
     · Toma la sesión del portal LIVES (misma dirección github.io, se comparte sola).
     · v4 · SIN BLOQUEO: la herramienta abre SIEMPRE. Ya no aparece "Abre esto desde el
       portal". Si hay sesión del portal, todo funciona como antes (nombre, llave,
       permisos, supervisión). Si no hay sesión (por ejemplo, abierta desde el portal de
       Sistemas), abre igual y lee con la clave pública.
     · Toda lectura a Supabase sale con la llave de la persona (si la hay) y la renueva
       antes de que venza (1 hora) sin chocar con el portal ni con otras pestañas.
     · El nombre de quien trabaja sale de la sesión: ?usuario= se reescribe con el real.
       Sin sesión, ?usuario= queda como venga en la dirección.
     · MODO SUPERVISIÓN (desde v3): Rodrigo (rcamogliano) ve y usa todo, nada se guarda.
       Christian (ctalepcio) tiene acceso completo. Solo aplica con sesión del portal.
     · v5 · PUENTE CON EL PORTAL DE SISTEMAS (temporal, riesgo aceptado por Christian el
       06/10/2026): si no hay sesión del portal LIVES y el link trae ?usuario=Nombre+Apellido,
       se pide a Supabase (función sesion-sistemas) la sesión de esa persona y la herramienta
       se recarga una vez ya con su nombre y sus permisos. El nombre no se verifica hasta que
       Sistemas firme el link. Esa sesión vive solo en la pestaña (no pasa al portal LIVES) y
       se descarta si el link trae otro nombre. Cuentas excluidas: las define Supabase.
     · v5.1 · NOMBRE AL DÍA: al abrir, se pregunta a Supabase el nombre vigente de quien
       tiene la sesión (mi_nombre). Si cambió (p. ej. por los nombres de Sistemas) se corrige
       la sesión guardada y la pantalla se recarga una sola vez con el nombre nuevo.
     · v5.2 · PORTAL NUEVO: el puente avisa si la herramienta está abierta dentro de
       app.lives.com.pe. Solo así Supabase acepta por el puente a Christian y a Rodrigo
       (Rodrigo siempre en supervisión). Con un link suelto, ellos no entran por el puente.
     ============================================================================ -->
<style id="lsCss">

  font-family:Calibri,Arial,sans-serif;font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 14px;

  color:#fff;font-family:Calibri,Arial,sans-serif;font-size:14px;font-weight:700;border-radius:10px;

</style>
<script id="lsJs">
(function(){
  'use strict';
  if (window.LIVES_SESION) return;                       /* por si el bloque quedara dos veces */

  var SB_URL  = 'https://xxfufpddgoyhbotjmaiy.supabase.co';
  var SB_KEY  = 'sb_publishable_1g-n6UT70EUlNAo8Lyc04w_jKR4LpXZ';
  var CLAVE   = 'lives_portal_sesion';                   /* misma llave que usa el portal */
  var CANDADO = 'lives_sb_renovando';
  var MOVIL   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  var GRACIA  = (MOVIL ? 720 : 60) * 60000;              /* igual que el portal */
  var fetchBase = window.fetch.bind(window);
  var yo = Math.random().toString(36).slice(2);

  /* ---------- guardar y leer la sesión (mismo formato que el portal) ---------- */
  function leerJ(area, k){ try{ return JSON.parse(area.getItem(k) || 'null'); }catch(e){ return null; } }
  function valida(d){
    return !!(d && d.token && d.permisos && d.sb && d.sb.access && d.sb.refresh);
  }

  /* La sesión vigente. Si hay dos copias (la de esta pestaña y el respaldo común) y son
     de la misma persona, se queda con la llave más nueva: otra pestaña o el portal pudo
     renovarla, y usar una llave ya renovada cierra la sesión en Supabase. */
  function sesion(){
    var s = null, r = null;
    try{ s = leerJ(sessionStorage, CLAVE); }catch(e){}
    try{
      var x = leerJ(localStorage, CLAVE + '_resp');
      if (x && valida(x.d) && (Date.now() - x.ts) < GRACIA) r = x.d;
    }catch(e){}
    if (!valida(s)) s = null;
    if (!s && r){ s = r; try{ sessionStorage.setItem(CLAVE, JSON.stringify(s)); }catch(e){} }
    if (s && r && r.usuario === s.usuario && r.sb && (!s.sb || r.sb.exp > s.sb.exp)){
      s.sb = r.sb;
      try{ sessionStorage.setItem(CLAVE, JSON.stringify(s)); }catch(e){}
    }
    return s;
  }
  function guardar(d){
    try{ sessionStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
    if (d && d.origen === 'sistemas') return;            /* sesión del puente: solo en esta pestaña */
    try{ localStorage.setItem(CLAVE + '_resp', JSON.stringify({ d: d, ts: Date.now() })); }catch(e){}
  }
  function borrar(){
    try{ sessionStorage.removeItem(CLAVE); }catch(e){}
    try{ localStorage.removeItem(CLAVE + '_resp'); }catch(e){}
  }
  /* Mientras se usa la herramienta, el respaldo cuenta desde la última actividad. */
  function refrescarMarca(){
    var s = sesion(); if (!s || s.origen === 'sistemas') return;
    try{ localStorage.setItem(CLAVE + '_resp', JSON.stringify({ d: s, ts: Date.now() })); }catch(e){}
  }
  setInterval(refrescarMarca, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refrescarMarca(); });

  function equipo(){
    var n = navigator.userAgent || '';
    var so = /Android/i.test(n) ? 'Android' : /iPhone|iPad/i.test(n) ? 'iPhone/iPad'
           : /Windows/i.test(n) ? 'Windows' : /Mac/i.test(n) ? 'Mac' : 'Otro';
    return so + (window.top === window ? ' · suelta' : '');
  }

  function pedir(ruta, cuerpo, token, ms){
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, ms || 15000);
    var cab = { 'Content-Type': 'application/json', apikey: SB_KEY };
    if (token) cab.Authorization = 'Bearer ' + token;
    return fetchBase(SB_URL + ruta, { method: 'POST', headers: cab, body: JSON.stringify(cuerpo || {}),
                                      cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(r){
        clearTimeout(reloj);
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
          return { status: r.status, ok: r.ok, json: j };
        });
      }, function(e){ clearTimeout(reloj); throw e; });
  }
  function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }

  /* ---------- llave vigente, renovada sin chocar con otras pestañas ---------- */
  var renovando = null;
  function llave(forzar){
    var s = sesion();
    if (!s || !s.sb || !s.sb.refresh) return Promise.resolve(null);
    if (!forzar && s.sb.exp - Date.now() > 60000) return Promise.resolve(s.sb.access);
    if (renovando) return renovando;
    var usada = s.sb.refresh;
    renovando = (function intento(n){
      var c = leerJ(localStorage, CANDADO);
      if (c && c.hasta > Date.now() && c.quien !== yo && n < 4){
        /* Otra pestaña o el portal está renovando: se espera y se usa lo que deje. */
        return esperar(1500).then(function(){
          var s2 = sesion();
          if (s2 && s2.sb && s2.sb.refresh !== usada && s2.sb.exp - Date.now() > 60000) return s2.sb.access;
          return intento(n + 1);
        });
      }
      try{ localStorage.setItem(CANDADO, JSON.stringify({ quien: yo, hasta: Date.now() + 10000 })); }catch(e){}
      return pedir('/auth/v1/token?grant_type=refresh_token', { refresh_token: usada })
        .then(function(r){
          if (r.ok && r.json && r.json.access_token){
            var s3 = sesion() || s;
            s3.sb = { access: r.json.access_token, refresh: r.json.refresh_token,
                      exp: Date.now() + (Number(r.json.expires_in) || 3600) * 1000 };
            guardar(s3);
            return s3.sb.access;
          }
          /* Rechazada: puede que otra pestaña la haya renovado un instante antes. */
          var s4 = sesion();
          if (s4 && s4.sb && s4.sb.refresh !== usada && s4.sb.exp - Date.now() > 60000) return s4.sb.access;
          /* v5: si la sesión del puente ya no se puede renovar, se descarta para que la
             próxima vez que se abra una herramienta el puente la vuelva a pedir. */
          if (r.status >= 400 && r.status < 500 && s.origen === 'sistemas'){
            borrar(); try{ sessionStorage.removeItem('lives_puente_recargado'); }catch(e){}
          }
          return null;
        }, function(){ return null; })                                             /* sin señal */
        .then(function(tk){
          try{ var c2 = leerJ(localStorage, CANDADO); if (c2 && c2.quien === yo) localStorage.removeItem(CANDADO); }catch(e){}
          return tk;
        });
    })(0).then(function(tk){ renovando = null; return tk; }, function(){ renovando = null; return null; });
    return renovando;
  }

  /* ---------- toda lectura a Supabase sale con la llave de la persona ---------- */
  function conLlave(init, tk){
    var o = {}, k;
    init = init || {};
    for (k in init) o[k] = init[k];
    var h = {};
    if (init.headers && typeof init.headers.forEach === 'function' && !(init.headers instanceof Array)){
      init.headers.forEach(function(v, n){ h[n] = v; });
    } else if (init.headers){
      for (k in init.headers) h[k] = init.headers[k];
    }
    var tiene = false;
    for (k in h) if (k.toLowerCase() === 'authorization') tiene = true;
    if (!tiene && tk) h.Authorization = 'Bearer ' + tk;
    var tieneKey = false;
    for (k in h) if (k.toLowerCase() === 'apikey') tieneKey = true;
    if (!tieneKey) h.apikey = SB_KEY;
    o.headers = h;
    return o;
  }

  /* ---------- MODO SUPERVISIÓN (desde v3) ---------- */
  /* Solo Rodrigo supervisa. Christian (ctalepcio) tiene acceso completo y guarda en
     todas las herramientas (lo da Supabase con es_superusuario()). */
  var SUPERVISORES = ['rcamogliano'];
  function supervisando(){
    var s = sesion(); if (!s) return false;
    return SUPERVISORES.indexOf(String(s.usuario || '').trim().toLowerCase()) !== -1;
  }
  /* El bloqueo de verdad lo hace Supabase: para los supervisores, todo pedido que intenta
     guardar corre en modo "solo lectura" y la base lo rechaza (y los archivos tampoco se
     suben). Aquí solo se deja la pantalla activa y se avisa con claridad. */
  var RPC_PUEDE = /(puede|permiso|es_editor|editor_de)/i;
  function rutaSB(url){ return url.indexOf(SB_URL) === 0 ? url.slice(SB_URL.length).split('?')[0] : ''; }
  function esRechazoSup(txt){ return /read-only transaction|solo lectura|SUPERVISION/i.test(txt || ''); }
  var _toastT = null;
  function avisoSup(txt){
    function poner(){
      var t = document.getElementById('lsToast');
      if (!t){ t = document.createElement('div'); t.id = 'lsToast'; document.body.appendChild(t); }
      t.textContent = txt; t.style.display = 'block';
      clearTimeout(_toastT); _toastT = setTimeout(function(){ t.style.display = 'none'; }, 4500);
    }
    if (document.body) poner(); else document.addEventListener('DOMContentLoaded', poner);
  }
  function marcaSup(){
    if (!supervisando() || document.getElementById('lsSup')) return;
    var b = document.createElement('div'); b.id = 'lsSup';
    b.textContent = '👁️ Modo supervisión · puedes usar todo, nada se guarda';
    document.body.appendChild(b);
  }
  if (document.body) marcaSup(); else document.addEventListener('DOMContentLoaded', marcaSup);
  function respuesta(cuerpo, estado){
    return new Response(JSON.stringify(cuerpo), { status: estado,
      headers: { 'Content-Type': 'application/json' } });
  }

  /* Para supervisores: "¿puede editar?" pasa a sí, y los rechazos por solo lectura se
     convierten en un aviso claro. Todo lo demás pasa igual que siempre. */
  function ajustarSup(r, url, metodo){
    if (!supervisando()) return r;
    var ruta = rutaSB(url);
    if (!ruta) return r;
    var esRpc = ruta.indexOf('/rest/v1/rpc/') === 0;
    var fn = esRpc ? ruta.slice('/rest/v1/rpc/'.length) : '';
    if (!r.ok){
      return r.clone().text().then(function(t){
        var sube = ruta.indexOf('/storage/v1/object') === 0 && !/\/object\/(list|sign|info)\//.test(ruta) &&
                   String(metodo).toUpperCase() !== 'GET';
        if (esRechazoSup(t) || sube){
          avisoSup('👁️ Modo supervisión: no se guardó. Estás revisando, los datos no cambian.');
          return respuesta({ message: 'Modo supervisión: no se guardó (estás revisando).',
                             error: 'MODO_SUPERVISION', code: 'SUPERVISION' }, r.status);
        }
        return r;
      }, function(){ return r; });
    }
    if (!esRpc) return r;
    return r.clone().text().then(function(t){
      var x = t.trim();
      if (RPC_PUEDE.test(fn) && (x === 'false' || x === '')) return respuesta(true, 200);
      if (x.charAt(0) === '{' && /"(puede|es_editor|editor)[a-z_]*"\s*:\s*false/i.test(x)){
        try{
          var o = JSON.parse(x), k, cambio = false;
          for (k in o) if (/^(puede|es_editor|editor)/i.test(k) && o[k] === false){ o[k] = true; cambio = true; }
          if (cambio) return respuesta(o, r.status);
        }catch(e){}
      }
      return r;
    }, function(){ return r; });
  }

  /* ---------- sin sesión: solo se anota en la consola, nunca se bloquea ---------- */
  var anotado = false;
  function sinSesion(){
    if (anotado) return;
    anotado = true;
    try{ console.info('[lives-sesion v5.2] Sin sesión del portal LIVES: se usa la clave pública.'); }catch(e){}
  }

  window.fetch = function(entrada, init){
    var url = (typeof entrada === 'string') ? entrada
            : (entrada && entrada.url) ? entrada.url : String(entrada || '');
    var metodo = (init && init.method) || (entrada && entrada.method) || 'GET';
    if (supervisando() && url.indexOf(SB_URL) === 0 && url.indexOf(SB_URL + '/rest/v1/') !== 0){
      return fetchBase(entrada, init).then(function(r){ return ajustarSup(r, url, metodo); });
    }
    if (typeof entrada !== 'string' || url.indexOf(SB_URL + '/rest/v1/') !== 0) return fetchBase(entrada, init);
    return esperaPuente().then(function(){ return llave(false); }).then(function(tk){
      if (!tk) sinSesion();
      return fetchBase(url, conLlave(init, tk)).then(function(r){
        if (r.status !== 401 || !tk) return ajustarSup(r, url, metodo);
        /* 401 con llave: venció o la cerraron. Se renueva una vez y se reintenta. */
        return llave(true).then(function(tk2){
          if (!tk2){ sinSesion(); return r; }
          return fetchBase(url, conLlave(init, tk2)).then(function(r2){
            return ajustarSup(r2, url, metodo);
          });
        });
      });
    });
  };

  /* ---------- el nombre sale de la sesión, no de la dirección ---------- */
  function fijarNombre(s){
    if (!s || !s.nombre) return;
    try{
      var u = new URL(location.href);
      if (u.searchParams.get('usuario') !== s.nombre){
        u.searchParams.set('usuario', s.nombre);
        u.searchParams.delete('nombre');
        history.replaceState(history.state, '', u.toString());
      }
    }catch(e){}
  }

  /* ---------- v5 · puente con el portal de Sistemas ---------- */
  var PUENTE_OK = 'lives_puente_recargado';
  function norm(x){
    return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[+._-]/g, ' ')
             .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function nombreLink(){
    try{ var u = new URL(location.href); return (u.searchParams.get('usuario') || u.searchParams.get('nombre') || '').trim(); }
    catch(e){ return ''; }
  }
  var pedido = nombreLink();
  var sx = sesion();
  /* Sesión del puente de otra persona (computadora compartida): se descarta. */
  if (sx && sx.origen === 'sistemas' && pedido && norm(pedido) !== norm(sx.nombre)){ borrar(); sx = null; }
  var puente = null;
  function enPortalNuevo(){
    if (window.top === window) return false;
    var anc = '';
    try{ var ao = location.ancestorOrigins; if (ao && ao.length) anc = ao[ao.length - 1]; }catch(e){}
    var ref = ''; try{ ref = document.referrer || ''; }catch(e){}
    return /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(anc) || /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(ref);
  }
  function esperaPuente(){ return puente || Promise.resolve(); }
  if (!sx && pedido && norm(pedido).length >= 5){
    var yaRecargo = null; try{ yaRecargo = sessionStorage.getItem(PUENTE_OK); }catch(e){}
    if (yaRecargo !== norm(pedido)){
      var raiz = document.documentElement, oculto = false;
      try{ raiz.style.visibility = 'hidden'; oculto = true; }catch(e){}
      var mostrar = function(){ if (oculto){ try{ raiz.style.visibility = ''; }catch(e){} oculto = false; } };
      var tope = setTimeout(mostrar, 6000);                 /* nunca deja la pantalla en blanco */
      puente = (function(){
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
        return fetchBase(SB_URL + '/functions/v1/sesion-sistemas', {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
          body: JSON.stringify({ nombre: pedido, equipo: equipo(), desde: location.pathname, portal_nuevo: enPortalNuevo() }),
          cache: 'no-store', signal: ctl ? ctl.signal : undefined
        }).then(function(r){ clearTimeout(reloj); return r.json(); })
          .then(function(j){
            if (!j || !j.ok || !j.sesion || !j.sesion.sb){ sinSesion(); mostrar(); clearTimeout(tope); return; }
            var d = j.sesion;
            d.sb = { access: d.sb.access, refresh: d.sb.refresh, exp: Date.now() + (Number(d.sb.expira_en) || 3600) * 1000 };
            d.vsesion = null;
            guardar(d);
            try{ sessionStorage.setItem(PUENTE_OK, norm(pedido)); }catch(e){}
            location.reload();                               /* se vuelve a abrir ya con su sesión */
          }, function(){ clearTimeout(reloj); sinSesion(); mostrar(); clearTimeout(tope); });
      })();
    }
  }

  /* ---------- al abrir ---------- */
  var s0 = sesion();
  if (!s0){
    sinSesion();
  } else {
    fijarNombre(s0);
    /* Si alguien ejecutó cerrar_todas_las_sesiones(), esta sesión ya no vale: se descarta
       y la herramienta sigue abierta sin sesión. Sin señal no se hace nada. */
    pedir('/rest/v1/rpc/version_sesion', {}, null, 8000).then(function(v){
      if (!v.ok || typeof v.json !== 'number') return;
      var s = sesion(); if (!s) return;
      if (s.vsesion === undefined || (s.vsesion !== null && s.vsesion !== v.json)){ borrar(); sinSesion(); return; }
      if (s.vsesion === null){ s.vsesion = v.json; guardar(s); }
    }).catch(function(){});
    /* v5.1: el nombre de la sesión se pone al día con el de la base (una recarga, una vez). */
    llave(false).then(function(tk){
      if (!tk) return;
      return pedir('/rest/v1/rpc/mi_nombre', {}, tk, 8000).then(function(v){
        if (!v.ok || typeof v.json !== 'string' || !v.json) return;
        var s = sesion(); if (!s || v.json === s.nombre) return;
        s.nombre = v.json; guardar(s); fijarNombre(s);
        var ya = null; try{ ya = sessionStorage.getItem('lives_nombre_al_dia'); }catch(e){}
        if (ya !== v.json){
          try{ sessionStorage.setItem('lives_nombre_al_dia', v.json); }catch(e){}
          location.reload();
        }
      });
    }).catch(function(){});
    /* Abierta fuera del portal: se anota igual que cuando se abre desde el portal. */
    if (window.top === window && s0.sb){
      document.addEventListener('DOMContentLoaded', function(){
        llave(false).then(function(tk){
          if (!tk) return;
          return pedir('/rest/v1/rpc/registrar_apertura',
            { p_herramienta: (document.title || location.pathname) + ' (suelta)',
              p_url: location.origin + location.pathname, p_equipo: equipo() }, tk, 10000);
        }).catch(function(){});
      });
    }
  }

  window.LIVES_SESION = {
    version: 'lives-sesion v5.2 · 2026-10-06 (sin bloqueo · nombre al día · supervisión · puente Sistemas · portal nuevo)',
    supervision: function(){ return supervisando(); },
    actual: function(){ var s = sesion(); return s ? { usuario: s.usuario, nombre: s.nombre, conSupabase: !!s.sb } : null; },
    llave: function(){ return llave(false); },
    pedir: function(){ sinSesion(); }       /* se mantiene por compatibilidad: ya no bloquea */
  };
})();
</script>
<!-- ===== fin lives-sesion v5.2 ===== -->

<style>

.volver{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:9px 15px;cursor:pointer;white-space:nowrap;}
.wrap{padding:16px 18px 50px;}

#acceso{position:fixed;inset:0;background:var(--warm-light);z-index:120;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
#acceso .cajaAcc{background:#fff;border:1px solid var(--warm);border-radius:12px;padding:26px;max-width:410px;width:100%;}
#acceso .logoAcc{background:var(--petrol);border-bottom:3px solid var(--emer);border-radius:8px;padding:16px;text-align:center;margin:-26px -26px 20px;border-radius:12px 12px 0 0;}
#acceso .logoAcc img{height:34px;}
#acceso h2{font-size:19px;margin:0 0 3px;}
#acceso .subAcc{font-size:12.5px;color:var(--stone);margin:0 0 16px;}
#acceso .aerr{display:none;background:#FBE9E9;border:1px solid var(--rose);border-radius:6px;padding:10px 12px;color:#DC2626;font-size:12.5px;margin-bottom:12px;}
#acceso .legAcc{font-size:11px;color:var(--stone);margin-top:13px;text-align:center;line-height:1.5;}
.panel{background:#fff;border:1px solid var(--warm);border-radius:8px;padding:14px 16px;margin-bottom:16px;}
.panel .pt{font-size:15px;font-weight:700;color:#333;}
.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:10px;}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--stone);margin-bottom:5px;}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
input.txt,select.txt{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1.5px solid var(--warm);border-radius:6px;background:#fff;}
input.txt:focus,select.txt:focus{outline:none;border-color:var(--sage);}
.btn{background:var(--sage);color:#fff;font-weight:700;font-family:inherit;font-size:13.5px;border:none;border-radius:6px;padding:10px 18px;cursor:pointer;}
.btn:hover{background:var(--sage-dark);}
.btn.ghost{background:#fff;border:1px solid var(--warm);color:var(--sage);}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
.err{display:none;background:#FBE9E9;border:1px solid var(--rose);border-radius:8px;padding:12px 16px;color:#DC2626;font-size:13px;margin-bottom:16px;}

.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--warm);border-radius:8px;padding:13px 15px;flex:1;min-width:110px;}
.kpi .v{font-size:25px;font-weight:700;color:var(--sage);line-height:1.1;}
.kpi .l{font-size:12px;color:#333;font-weight:600;margin-top:3px;}
.kpi.mal .v{color:var(--rose);}

.fila{background:#fff;border:1px solid var(--warm);border-left:4px solid var(--sage);border-radius:8px;padding:12px 14px;margin-bottom:9px;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.fila.rech{border-left-color:var(--rose);}
.fila .est{font-size:17px;font-weight:800;min-width:62px;}
.fila .inf{flex:1;min-width:0;font-size:12.5px;color:var(--stone);overflow-wrap:anywhere;}
.fila .inf b{color:#333;}
.fila .res{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.res.ap{background:#ECFDF5;color:#065F46;border:1px solid var(--emer);}
.res.re{background:#FEF2F2;color:#991B1B;border:1px solid var(--rose);}
.vacio{background:#fff;border:1px dashed var(--warm);border-radius:8px;padding:28px 20px;text-align:center;color:var(--stone);font-size:13.5px;}
.cargando{text-align:center;padding:34px;color:var(--stone);font-size:13.5px;}
.sectitle{font-size:16px;font-weight:700;color:var(--sage-dark);margin:20px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--warm);}

/* ---- visor de la ficha ---- */
#visor{position:fixed;inset:0;z-index:400;background:#1c2320;display:none;flex-direction:column;}
#visor .vbar{background:var(--petrol);border-bottom:2px solid var(--emer);padding:9px 12px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;}
#visor .vvolver{background:#fff;color:var(--petrol);border:none;font-family:inherit;font-size:13px;
  font-weight:800;border-radius:6px;padding:9px 14px;cursor:pointer;white-space:nowrap;}
#visor .vtit{flex:1;min-width:0;color:#fff;font-size:12.5px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#visor .vdrive{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;
  font-size:12px;font-weight:700;border-radius:6px;padding:8px 12px;text-decoration:none;white-space:nowrap;}
#visor .vcuerpo{flex:1;position:relative;background:#2b3532;}
#visor iframe{width:100%;height:100%;border:none;display:block;background:#fff;}

/* ---- membrete (solo al imprimir) ---- */
#membrete{display:none;align-items:center;gap:16px;padding:0 0 10px;border-bottom:2px solid #0E3B36;margin-bottom:14px;}
#membrete img{height:40px;}
#membrete .mt{font-size:15px;font-weight:800;color:#0E3B36;letter-spacing:.3px;}
#membrete .ms{font-size:12px;color:#444;margin-top:2px;}
#membrete .mfec{margin-left:auto;font-size:11px;color:#555;text-align:right;}

@media print{
  @page{ size:A4 portrait; margin:12mm; }
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  body{ background:#fff!important; font-size:11px; }
  .header,.wrap,#det .top,.volver{ display:none!important; }
  #det{ position:static!important; display:block!important; background:#fff!important; overflow:visible!important; }
  #det .cuerpo{ padding:0!important; }
  #membrete{ display:flex!important; }
  .panel{ border:1px solid #999!important; box-shadow:none!important; break-inside:avoid; page-break-inside:avoid; margin-bottom:10px!important; }
  table{ min-width:0!important; font-size:10px; break-inside:auto; }
  th,td{ border:1px solid #999!important; padding:3px 5px!important; }
  th{ background:#EEE!important; }
  td.cod{ background:#F5F5F5!important; }
  td.dif.mal{ background:#FFE4E4!important; color:#B00!important; }
  tr{ break-inside:avoid; page-break-inside:avoid; }
  thead{ display:table-header-group; }
  .tallaTit{ break-after:avoid; page-break-after:avoid; margin-top:10px!important; }
  .tw{ overflow:visible!important; }
  .leyenda{ font-size:9px; }
  .firmas{ display:flex!important; }
  .soloweb{ display:none!important; }
  #acceso,#visor{ display:none!important; }
}
.firmas{display:none;gap:40px;margin-top:26px;padding-top:6px;}
.firmas div{flex:1;border-top:1px solid #666;padding-top:5px;font-size:10px;color:#333;text-align:center;}

/* ---- visor de la ficha ---- */












/* ---- ficha de detalle ---- */
#det{position:fixed;inset:0;background:var(--warm-light);z-index:60;display:none;overflow-y:auto;}
#det .top{background:var(--petrol);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--emer);flex-wrap:wrap;}
#det .top .t{font-size:16px;font-weight:800;}
#det .top .s{font-size:11.5px;color:#CFE5DE;}
#det .top .btns{margin-left:auto;display:flex;gap:8px;}
#det .top button{background:#fff;color:var(--petrol);border:none;font-family:inherit;font-size:12.5px;font-weight:800;border-radius:6px;padding:8px 15px;cursor:pointer;}
#det .top button.alt{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;}
#det .cuerpo{padding:16px 18px 50px;}
.cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 16px;font-size:12.5px;}
.cab div span{color:var(--stone);}
.cab div b{color:#333;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px;}
th,td{border:1px solid var(--warm);padding:6px 8px;text-align:center;}
th{background:var(--warm-light);color:var(--stone);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
td.cod{font-weight:800;background:var(--warm-light);width:46px;}
td.desc{text-align:left;font-size:11.5px;color:var(--stone);min-width:190px;}
td.esp{font-weight:700;}
td.tol{color:var(--slate);}
td.dif{font-weight:800;}
td.dif.ok{color:var(--sage);}
td.dif.mal{color:var(--rose);background:#FEF2F2;}
td.nada{color:#C8D3CF;}
.tallaTit{font-size:14px;font-weight:800;color:var(--sage-dark);margin:18px 0 8px;}
.leyenda{font-size:11.5px;color:var(--stone);margin-top:8px;}
</style>
</head>

function jsonp(params, cb){
  var p=qsObj(params), m=SB_MAPA[p.accion||'datos'];
  if(!m){ sinConexion(cb, p.accion); return; }
  var d=m(p);
  (function intento(n){
    sbRpc(d[0], d[1], function(err, r){
      if(err || !r){
        // señal irregular: un reintento antes de avisar; nunca queda bloqueada
        if(n<1){ setTimeout(function(){ intento(n+1); }, 1500); return; }
        try{ console.warn('Supabase no respondió.', err); }catch(e){}
        sinConexion(cb, p.accion);
        return;
      }
      if(r.ok===false){ cb(r); return; }   // la base respondió con un aviso propio: se muestra tal cual
      ORIGEN_DATOS='supabase';
      cb(d[2] ? d[2](r) : r);
    });
  })(0);
}
function normNombre(t){
  return String(t||'').normalize('NFD').replace(/[\u0300-\u0302\u0304-\u036f]/g,'').normalize('NFC')
           .toUpperCase().replace(/\s+/g,' ').trim();
}

function sinConexion(cb, accion){
  var msg = accion==='bytes'
    ? 'No se pudo bajar la ficha. Revisa tu señal y vuelve a tocarla; si sigue sin abrir, avisa a Luz.'
    : 'No hay conexión con la base de datos. Revisa tu señal y vuelve a intentar.';
  setTimeout(function(){ cb({ ok:false, error:msg }); }, 0);
}

/* ---------- fracciones ---------- */
function aFrac(dec){
  if(dec===null||dec===undefined||isNaN(dec)) return '—';
  var neg=dec<0; dec=Math.abs(dec);
  var ent=Math.floor(dec+1e-9), r=dec-ent, d=16, n=Math.round(r*d);
  if(n===16){ ent++; n=0; }
  var s;
  if(n===0) s=''+ent;
  else{ while(n%2===0&&d%2===0){n/=2;d/=2;} s=(ent?ent+' ':'')+n+'/'+d; }
  return (neg?'−':'')+s;
}

/* ---------- arranque ---------- */
var DESDE_BUSCADOR=false;

function paramDe(n){
  var q=location.search.replace(/^\?/,'').split('&');
  for(var i=0;i<q.length;i++){
    var p=q[i].split('=');
    if(decodeURIComponent(p[0])===n) return decodeURIComponent((p[1]||'').replace(/\+/g,' '));
  }
  return '';
}

function arrancar(){
  var s=null;
  try{ s=JSON.parse(LS.get('lives_fichas')||'null'); }catch(e){}
  var c = paramDe('clave') || (s && s.clave) || CLAVE_SISTEMA;
  try{ var g=LS.get('lives_clave'); if(!paramDe('clave') && g) c=g; }catch(e){}
  DESDE_BUSCADOR = !!(s && s.clave) && !paramDe('usuario');
  SES={ nombre: paramDe('usuario') || (s&&s.auditora) || '',
        area:   paramDe('area')    || (s&&(s.rol||s.taller)) || '',
        clave:  c };
  iniciar();
}

function iniciar(){
  document.getElementById('app').style.display='block';
  var q=document.getElementById('quienHd');
  if(q) q.textContent = SES.nombre ? SES.nombre+(SES.area?' · '+SES.area:'') : '';
  var p=params();
  if(p.estilo) document.getElementById('fEstilo').value=p.estilo;
  jsonp('accion=listas', function(r){
    if(r&&r.ok){
      // mediciones en planta propia se guardan como LIVES
      [{nombre:'LIVES'}].concat((r.talleres||[]).filter(function(t){ return String(t.nombre).toUpperCase()!=='LIVES'; }))
        .forEach(function(t){
          var o=document.createElement('option'); o.value=t.nombre;
          o.textContent = t.nombre==='LIVES' ? 'LIVES (planta propia)' : t.nombre;
          document.getElementById('fTaller').appendChild(o);
        });
      (r.auditoras||[]).forEach(function(a){
        var n = typeof a==='string'? a : a.nombre;
        var o=document.createElement('option'); o.value=n; o.textContent=n;

function params(){
  var o={}, q=location.search.replace(/^\?/,'').split('&');
  q.forEach(function(x){
    if(!x) return;
    var p=x.split('=');
    o[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' '));
  });
  return o;
}

  ['fEstilo','fGrupo','fDesde','fHasta'].forEach(function(i){ document.getElementById(i).value=''; });
  document.getElementById('fTaller').value=''; document.getElementById('fAud').value='';
  buscar();

function buscar(){
  document.getElementById('salida').innerHTML='<div class="cargando">Buscando…</div>';
  document.getElementById('sync').textContent='';
  var q='accion=mediciones&clave='+encodeURIComponent(SES.clave);
  [['fEstilo','estilo'],['fGrupo','grupo'],['fTaller','taller'],
   ['fAud','auditora'],['fDesde','desde'],['fHasta','hasta']].forEach(function(p){
    var v=document.getElementById(p[0]).value.trim();
    if(v) q+='&'+p[1]+'='+encodeURIComponent(v);
  });
  jsonp(q, function(r){
    if(!r || !r.ok){
      error((r&&r.error)||'No se pudo cargar.');
      document.getElementById('salida').innerHTML='<div class="vacio">Sin conexión.</div>';
      return;
    }
    error(''); MEDS=r.mediciones||[];
    pintarKpis(); pintarLista();
    document.getElementById('sync').textContent=
      'Actualizado '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  });
}

function pintarKpis(){
  var k=document.getElementById('kpis');
  if(!MEDS.length){ k.style.display='none'; return; }
  var rech=MEDS.filter(function(m){ return m.resultado==='RECHAZADO'; }).length;
  var medidas=MEDS.reduce(function(a,m){ return a+(+m.nMedidas||0); },0);
  var fuera=MEDS.reduce(function(a,m){ return a+(+m.nFuera||0); },0);
  var est={}; MEDS.forEach(function(m){ est[m.estilo]=1; });

   '<div class="kpi"><div class="v">'+MEDS.length+'</div><div class="l">Auditorías</div></div>'+
   '<div class="kpi'+(rech?' mal':'')+'"><div class="v">'+rech+'</div><div class="l">Rechazadas</div></div>'+
   '<div class="kpi"><div class="v">'+Object.keys(est).length+'</div><div class="l">Estilos</div></div>'+
   '<div class="kpi"><div class="v">'+medidas+'</div><div class="l">Medidas tomadas</div></div>'+
   '<div class="kpi'+(fuera?' mal':'')+'"><div class="v">'+fuera+'</div><div class="l">Fuera de tolerancia</div></div>';

function pintarLista(){
  var out=document.getElementById('salida');
  if(!MEDS.length){
    out.innerHTML='<div class="vacio">No hay mediciones con esos filtros.</div>';
    return;
  }
  var dias={};
  MEDS.forEach(function(m){ (dias[String(m.fecha).slice(0,10)]=dias[String(m.fecha).slice(0,10)]||[]).push(m); });
  var h='';
  Object.keys(dias).sort().reverse().forEach(function(d){
    h+='<div class="sectitle">'+fechaLarga(d)+' — '+dias[d].length+' auditoría(s)</div>';
    dias[d].forEach(function(m){
      var re = m.resultado==='RECHAZADO';
      h+='<div class="fila'+(re?' rech':'')+'" onclick="verDetalle(\''+m.id+'\')">'+
         '<div class="est">'+m.estilo+(m.version?'<br><span style="font-size:11px;color:var(--stone);">'+m.version+'</span>':'')+'</div>'+
         '<div class="inf"><b>'+(m.grupo||'—')+'</b> · '+(m.color||'—')+
         (m.etapa?' · '+(NOM_ETAPA[m.etapa]||m.etapa):'')+
         '<br>'+(m.auditora||'—')+' · '+(m.taller||'—')+' · '+String(m.fecha).slice(11)+
         '<br>'+m.nMedidas+' medidas · '+(m.nFuera>0
             ? '<b style="color:var(--rose);">'+m.nFuera+' fuera de tolerancia</b>'
             : 'todas dentro de tolerancia')+'</div>'+
         '<div class="res '+(re?'re':'ap')+'">'+(m.resultado||'—')+'</div>'+
         '</div>';
    });
  });
  out.innerHTML=h;
}
function fechaLarga(iso){
  if(!iso) return 'Sin fecha';
  var p=iso.split('-'), m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var hoy=new Date().toISOString().slice(0,10);
  return (iso===hoy?'Hoy · ':'')+p[2]+' '+m[+p[1]-1]+' '+p[0];
}

function pintarDetalle(m){
  FICHA = m.fileId ? {id:m.fileId, nombre:m.archivo||'Ficha', estilo:m.estilo} : null;
  document.getElementById('btnFicha').style.display = FICHA ? 'inline-block' : 'none';
  document.getElementById('dTit').textContent = m.estilo+' · '+(m.grupo||'');
  document.getElementById('dSub').textContent =
    (NOM_ETAPA[m.etapa]||'')+(m.combo?' · '+m.combo:'')+' · '+m.auditora+' · '+m.taller;

  var puntos = (m.espec && m.espec.puntos) ? m.espec.puntos : [];
  var descDe={}, tolDe={}, espDe={};
  puntos.forEach(function(p){
    descDe[p.cod]=p.desc||'';
    tolDe[p.cod]=p.tol;
    espDe[p.cod]=p.vals;
  });

  var h='<div class="panel"><div class="pt">Datos de la auditoría</div><div class="cab">'+
    dato('Estilo',m.estilo)+dato('Grupo',m.grupo)+dato('Cliente',m.cliente)+
    dato('Color',m.color)+dato('Combo de ficha',m.combo||'—')+
    dato('Etapa',NOM_ETAPA[m.etapa]||m.etapa)+
    dato('Versión de ficha',m.version||'—')+
    dato('Auditora',m.auditora)+dato('Taller',m.taller)+dato('Fecha',m.fecha)+
    dato('Resultado',m.resultado)+
    '</div></div>';

  // agrupar por talla
  var porTalla={};
  (m.detalle||[]).forEach(function(d){ (porTalla[d.talla]=porTalla[d.talla]||[]).push(d); });
  var tallas=Object.keys(porTalla);

  if(!tallas.length){
    h+='<div class="vacio">Esta auditoría no tiene medidas registradas.</div>';
    document.getElementById('dCuerpo').innerHTML=h;
    return;
  }

  tallas.forEach(function(t){
    var dets=porTalla[t];
    var prendas=[];
    dets.forEach(function(d){ if(prendas.indexOf(d.prenda)<0) prendas.push(d.prenda); });
    prendas.sort(function(a,b){ return a-b; });

    // puntos medidos en esta talla, en el orden de la ficha
    var medidos=[];
    dets.forEach(function(d){ if(medidos.indexOf(d.cod)<0) medidos.push(d.cod); });
    var orden = puntos.map(function(p){ return p.cod; }).filter(function(c){ return medidos.indexOf(c)>=0; });
    medidos.forEach(function(c){ if(orden.indexOf(c)<0) orden.push(c); });

    var hayDesc = orden.some(function(c){ return descDe[c] && descDe[c].length>3; });

    h+='<div class="tallaTit">Talla '+t+' — '+prendas.length+' prenda(s)</div>';
    h+='<div class="panel" style="padding:12px 14px;"><div class="tw"><table><thead><tr>'+
       '<th>Cód.</th>'+(hayDesc?'<th style="text-align:left;">Descripción</th>':'')+
       '<th>Esperado</th><th>Tol. ±</th>'+
       prendas.map(function(p){ return '<th>Prenda '+p+'</th>'; }).join('')+
       '</tr></thead><tbody>';

    orden.forEach(function(cod){
      var esp = espDe[cod] ? espDe[cod][t] : null;
      var tol = tolDe[cod];
      h+='<tr><td class="cod">'+cod+'</td>';
      if(hayDesc) h+='<td class="desc">'+(descDe[cod]||'')+'</td>';
      h+='<td class="esp">'+aFrac(esp)+'</td><td class="tol">'+aFrac(tol)+'</td>';
      prendas.forEach(function(p){
        var d=dets.filter(function(x){ return x.cod===cod && x.prenda===p; })[0];
        if(!d){ h+='<td class="nada">·</td>'; return; }
        var txt = (d.difTxt && d.difTxt!=='—') ? d.difTxt : '—';
        h+='<td class="dif '+(d.ok?'ok':'mal')+'" title="Medida real: '+aFrac(d.real)+'">'+txt+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>'+
       '<div class="leyenda">Se muestra la <b>diferencia</b> respecto a la medida de ficha. '+
       '«—» es sin diferencia. En rojo, lo que se pasó de tolerancia.'+
       '<span class="soloweb"> Pasa el cursor sobre un valor para ver la medida real.</span></div></div>';
  });

  h+='<div class="firmas"><div>Auditora: '+(m.auditora||'')+'</div>'+
     '<div>Supervisor de Calidad</div><div>Jefe de Planta</div></div>';

  document.getElementById('dCuerpo').innerHTML=h;
  document.getElementById('mSub').textContent =
    'Estilo '+m.estilo+'  ·  '+(m.grupo||'')+'  ·  '+(m.cliente||'')+'  ·  '+
    (NOM_ETAPA[m.etapa]||'')+(m.combo?'  ·  '+m.combo:'')+'  ·  Resultado: '+(m.resultado||'—');
  document.getElementById('mFec').innerHTML =
    'Auditoría: '+m.fecha+'<br>Impreso: '+new Date().toLocaleString('es-PE');
}

function anchos(h,n,grupos){

/* Libro: hoja Resumen (secciones como en pantalla) + hoja Detalle (cada registro). */
function libro(cfg){
  return cargarExcelJS().then(function(){
    var wb=new ExcelJS.Workbook();wb.creator='LIVES';wb.created=new Date();
    var hoy=new Date().toLocaleString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    /* Resumen */
    var secs=(cfg.resumen||[]).filter(function(s){return s.filas&&s.filas.length;});
    if(secs.length){
      var n=Math.max.apply(null,secs.map(function(s){return s.columnas.length;}));
      var h=wb.addWorksheet('Resumen',{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0}});
      var f=cabecera(wb,h,n,cfg)+1;
      secs.forEach(function(s){
        var ct=h.getCell(f,1);ct.value=s.titulo;ct.font={name:'Calibri',size:12,bold:true,color:{argb:LX.PETROLEO}};h.getRow(f).height=20;f++;
        if(s.nota){banda(h,f++,n,s.nota,'nota');}
        encabezados(h,f,s.columnas);f++;datos(h,f,s.columnas,s.filas);f+=s.filas.length+1;
      });
      pie(h,f,n,'Generado el '+hoy+' desde '+(cfg.origen||cfg.titulo));
      anchos(h,n,secs.map(function(s){return {cols:s.columnas,filas:s.filas};}));
      if(h.getColumn(1).width<24)h.getColumn(1).width=24;
    }
    /* Detalle */
    var d=cfg.detalle;
    if(d&&d.columnas&&d.columnas.length){
      var nd=d.columnas.length;
      var hd=wb.addWorksheet('Detalle',{pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
      var fe=cabecera(wb,hd,nd,{titulo:cfg.titulo+' — Detalle',sub:cfg.sub,formula:d.nota||''});
      encabezados(hd,fe,d.columnas);datos(hd,fe+1,d.columnas,d.filas);
      hd.views=[{state:'frozen',xSplit:d.congelarCols||0,ySplit:fe}];
      hd.autoFilter={from:{row:fe,column:1},to:{row:fe+Math.max(d.filas.length,1),column:nd}};
      pie(hd,fe+d.filas.length+2,nd,'Generado el '+hoy+' desde '+(cfg.origen||cfg.titulo)+' · '+d.filas.length+' fila(s)');
      anchos(hd,nd,[{cols:d.columnas,filas:d.filas}]);
    }
    return wb.xlsx.writeBuffer().then(function(buf){
      var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=(cfg.titulo+(cfg.sub?'_'+cfg.sub:'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,90)+'.xlsx';
      document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    });
  });
}
function txt(sel){var e=typeof sel==='string'?document.querySelector(sel):sel;return e?(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim():'';}
function titulo(){return (document.title||'').replace(/\s*·\s*LIVES\s*$/,'').trim();}
function boton(ref,antes,clase,click){
  if(!ref||document.getElementById('lsXlsBtn'))return;
  var b=document.createElement('button');b.type='button';b.id='lsXlsBtn';b.className=clase;b.textContent='Descargar Excel';
  b.title='Descarga en Excel lo que estás viendo (resumen) y cada registro (detalle).';
  b.addEventListener('click',function(){
    var t=b.textContent;b.disabled=true;b.textContent='Preparando…';
    Promise.resolve().then(click).then(function(){b.textContent=t;b.disabled=false;},function(e){
      b.textContent=t;b.disabled=false;
      var m=document.getElementById('lsXlsErr');if(!m){m=document.createElement('div');m.id='lsXlsErr';m.style.cssText='color:#B42318;font-size:12px;margin:4px 0';b.parentNode.insertBefore(m,b.nextSibling);}
      m.textContent='No se pudo generar el Excel: '+(e&&e.message||e);setTimeout(function(){if(m)m.remove();},8000);});
  });
  if(antes)ref.parentNode.insertBefore(b,ref);else ref.parentNode.insertBefore(b,ref.nextSibling);
}

/* --- Check List de Orden y Limpieza --- */
var CHK={
  detecta:function(){return typeof contar==='function'&&typeof fabsActivas==='function'&&typeof hojaHTML==='function'&&document.getElementById('btnPdf');},
  pone:function(){boton(document.getElementById('btnPdf'),true,'btn',CHK.exporta);},
  exporta:function(){
    if(!FILAS||!FILAS.length||!F.sem)throw new Error('el tablero todavía está cargando los datos');
    var fabs=fabsActivas(),sem=F.sem,nsem=+sem.split('-S')[1];
    var lbl='Semana '+nsem+' · '+rangoSemana(sem)+' · '+(F.fab==='TODAS'?'Todas las fábricas':F.fab);
    var rows=FILAS.filter(function(f){return f.semanaEtq===sem&&fabs.indexOf(f.sede)>=0;});
    var pc=function(c){return c.ev?c.ok/c.ev:null;};
    var uniq=function(a){var o=[];a.forEach(function(x){if(!vacio(x)&&o.indexOf(x)<0)o.push(x);});return o;};
    var fila=function(k,r){var c=contar(r);return {k:k,dias:uniq(r.map(function(x){return x.dia;})).length,ev:c.ev,ok:c.ok,x:c.x,na:c.na,p:pc(c),aud:uniq(r.map(function(x){return x.auditor;})).join(', ')||null};};
    var ind=fabs.map(function(fb){return fila(fb,rows.filter(function(r){return r.sede===fb;}));});
    if(fabs.length>1){var t=fila('Total',rows);t.__total=true;ind.push(t);}
    var nota='% de cumplimiento = ítems OK ÷ (OK + X), sobre el total de marcas de la semana. Los N/A no entran al denominador. No hay meta definida por LIVES para este check list.';
    var res=[{titulo:'Cumplimiento — '+lbl,nota:nota,columnas:[{campo:'k',titulo:'Fábrica',tipo:'texto'},{campo:'dias',titulo:'Días registrados',tipo:'entero'},{campo:'ev',titulo:'Evaluados (OK + X)',tipo:'entero'},{campo:'ok',titulo:'OK',tipo:'entero'},{campo:'x',titulo:'No conformidades (X)',tipo:'entero'},{campo:'na',titulo:'N/A',tipo:'entero'},{campo:'p',titulo:'% Cumplimiento',tipo:'porcentaje'},{campo:'aud',titulo:'Auditor(es)',tipo:'texto'}],filas:ind}];
    var sec=[];fabs.forEach(function(fb){var its=itemsDeFabrica(fb),orden=[];its.forEach(function(i){if(orden.indexOf(i.seccion)<0)orden.push(i.seccion);});
      rows.forEach(function(r){if(r.sede===fb&&orden.indexOf(r.seccion)<0)orden.push(r.seccion);});
      orden.forEach(function(s){var r=rows.filter(function(x){return x.sede===fb&&x.seccion===s;});var c=contar(r);sec.push({f:fb,s:s,ev:c.ev,ok:c.ok,x:c.x,p:pc(c)});});});
    res.push({titulo:'Por sección',columnas:[{campo:'f',titulo:'Fábrica',tipo:'texto'},{campo:'s',titulo:'Sección',tipo:'texto'},{campo:'ev',titulo:'Evaluados',tipo:'entero'},{campo:'ok',titulo:'OK',tipo:'entero'},{campo:'x',titulo:'No conformidades',tipo:'entero'},{campo:'p',titulo:'% Cumplimiento',tipo:'porcentaje'}],filas:sec});
    var cmp=function(a,b){return String(a.fecha).localeCompare(String(b.fecha))||String(a.sede).localeCompare(String(b.sede))||String(a.seccion).localeCompare(String(b.seccion))||(a.n-b.n);};
    var marca=function(r){return {fe:fechaLocal(r.fecha),d:r.dia||null,f:r.sede,s:r.seccion,n:numero(r.n),it:r.item,re:r.res==='OK'||r.res==='X'?r.res:'N/A',o:vacio(r.obs)?null:r.obs,a:vacio(r.auditor)?null:r.auditor};};
    var colM=[{campo:'fe',titulo:'Fecha',tipo:'fecha'},{campo:'d',titulo:'Día',tipo:'texto'},{campo:'f',titulo:'Fábrica',tipo:'texto'},{campo:'s',titulo:'Sección',tipo:'texto'},{campo:'n',titulo:'N°',tipo:'entero'},{campo:'it',titulo:'Ítem',tipo:'texto'},{campo:'re',titulo:'Resultado',tipo:'texto'},{campo:'o',titulo:'Observación',tipo:'texto'},{campo:'a',titulo:'Auditor',tipo:'texto'}];
    var nc=rows.filter(function(r){return r.res==='X';}).sort(cmp).map(marca);
    res.push({titulo:'No conformidades de la semana ('+nc.length+')',nota:'Lo que se marcó X, con la observación que dejó el auditor en planta.',columnas:colM.filter(function(c){return c.campo!=='re';}),filas:nc});
    var base=typeof baseStats==='function'?baseStats():FILAS,gs={};base.forEach(function(r){(gs[r.semanaEtq]=gs[r.semanaEtq]||[]).push(r);});
    res.push({titulo:'Semana a semana — '+(F.fab==='TODAS'?'todas las fábricas':F.fab),nota:'Histórico completo, de la semana más reciente a la más antigua. Mismo cálculo: OK ÷ (OK + X) de cada semana.',
      columnas:[{campo:'s',titulo:'Semana',tipo:'texto'},{campo:'r',titulo:'Fechas',tipo:'texto'},{campo:'ev',titulo:'Evaluados',tipo:'entero'},{campo:'ok',titulo:'OK',tipo:'entero'},{campo:'x',titulo:'No conformidades',tipo:'entero'},{campo:'p',titulo:'% Cumplimiento',tipo:'porcentaje'}],
      filas:Object.keys(gs).filter(Boolean).sort().reverse().map(function(k){var c=contar(gs[k]);return {s:'Semana '+(+k.split('-S')[1])+' · '+k.split('-S')[0],r:rangoSemana(k),ev:c.ev,ok:c.ok,x:c.x,p:pc(c)};})});
    return libro({titulo:'Check List de Orden y Limpieza',sub:lbl,formula:nota,origen:'Check List de Orden y Limpieza',resumen:res,
      detalle:{columnas:colM,filas:rows.slice().sort(cmp).map(marca),congelarCols:3,nota:'Una fila por cada ítem marcado en la semana, tal como lo registró el auditor.'}});
  }
};

/* --- Tablero Círculo de Mejoras --- */
var MEJ={

  exporta:function(){

      filas:[{k:'Cerradas',v:d.cerr,p:pc(d.cerr,d.n),c:'llegaron al 100%'},{k:'En curso',v:d.proc,p:pc(d.proc,d.n),c:'entre 30% y 70% de avance'},{k:'Sin empezar',v:d.nini,p:pc(d.nini,d.n),c:'0% de avance'},
        {k:'Con fecha vencida',v:d.venc,p:pc(d.venc,d.n),c:'abiertas y con la fecha de cierre ya pasada'},{k:'Con evidencia',v:d.conFoto,p:pc(d.conFoto,d.n),c:'al menos un archivo cargado ('+d.fotos+' archivos en total)'},
        {k:'Reprogramadas',v:d.reprog,p:pc(d.reprog,d.n),c:'movieron su fecha de cierre al menos una vez'}]});
    var ta={n:0,s:0,c:0,p:0,z:0,v:0,f:0,r:0};
    var fa=pa.map(function(x){ta.n+=x.n;ta.s+=x.avance*x.n/100;ta.c+=x.cerr;ta.p+=x.curso;ta.z+=x.nada;ta.v+=x.venc;ta.f+=x.foto;ta.r+=x.reprog;
      return {k:x.area,n:x.n,c:x.cerr,p:x.curso,z:x.nada,v:x.venc,f:x.foto,r:x.reprog,a:x.avance/100,pf:x.pctFoto/100};});
    fa.push({k:'Total',n:ta.n,c:ta.c,p:ta.p,z:ta.z,v:ta.v,f:ta.f,r:ta.r,a:pc(ta.s,ta.n),pf:pc(ta.f,ta.n),__total:true});
    res.push({titulo:'Ranking por área',nota:'Avance del área = suma de los avances de sus ideas ÷ número de ideas del área. El total se calcula sobre todas las ideas, no promediando las áreas.',
      columnas:[{campo:'k',titulo:'Área',tipo:'texto'},{campo:'n',titulo:'Ideas',tipo:'entero'},{campo:'c',titulo:'Cerradas',tipo:'entero'},{campo:'p',titulo:'En curso',tipo:'entero'},{campo:'z',titulo:'Sin empezar',tipo:'entero'},{campo:'v',titulo:'Vencidas',tipo:'entero'},{campo:'f',titulo:'Con evidencia',tipo:'entero'},{campo:'r',titulo:'Reprogramadas',tipo:'entero'},{campo:'a',titulo:'% Avance',tipo:'porcentaje'},{campo:'pf',titulo:'% Con evidencia',tipo:'porcentaje'}],filas:fa});
    var vl=vencidasList();
    res.push({titulo:'Mejoras vencidas ('+vl.length+')',nota:'Abiertas y con la fecha comprometida ya pasada, de la más atrasada a la menos atrasada.',
      columnas:[{campo:'id',titulo:'Código',tipo:'alfanumerico'},{campo:'ar',titulo:'Área',tipo:'texto'},{campo:'i',titulo:'Idea de mejora',tipo:'texto'},{campo:'re',titulo:'Responsable',tipo:'texto'},{campo:'p',titulo:'Avance',tipo:'porcentaje'},{campo:'fc',titulo:'Fecha de cierre',tipo:'fecha'},{campo:'d',titulo:'Días de atraso',tipo:'entero'},{campo:'rp',titulo:'Reprogramaciones',tipo:'entero'}],
      filas:vl.map(function(m){return {id:m.id,ar:m.area,i:m.idea,re:vacio(m.responsable)?null:m.responsable,p:m.pct,fc:fechaLocal(m.fechaCierre),d:m._d,rp:m.vecesReprog||0};})});
    var det=d.f.slice().sort(function(a,b){return a.area===b.area?String(a.id).localeCompare(String(b.id)):String(a.area).localeCompare(String(b.area));}).map(function(m){
      var fc=String(m.fechaCierre||'').substring(0,10),t=function(v){return vacio(v)?null:String(v);};
      return {id:m.id,ar:m.area,i:t(m.idea),re:t(m.responsable),p:m.pct,es:estadoDe(m.pct),fc:fechaLocal(fc),v:(fc&&fc<hoy&&m.pct<1)?'Sí':'No',rp:m.vecesReprog||0,rv:t(m.revisar),ev:ev[m.id]||0,
        sa:t(m.situacionAntes),co:t(m.comentarios),rs:t(m.resultado),im:t(m.impacto),at:t(m.ahorroTiempo),am:t(m.ahorroMonto),fr:fechaLocal(m.fechaReg),fa:fechaLocal(m.fechaAct),ap:t(m.actualizadoPor)};});
    var cd=[{campo:'id',titulo:'Código',tipo:'alfanumerico',fija:1},{campo:'ar',titulo:'Área',tipo:'texto',fija:1},{campo:'i',titulo:'Idea de mejora',tipo:'texto',fija:1},{campo:'re',titulo:'Responsable',tipo:'texto'},{campo:'p',titulo:'Avance',tipo:'porcentaje',fija:1},{campo:'es',titulo:'Escalón',tipo:'texto',fija:1},
      {campo:'fc',titulo:'Fecha de cierre',tipo:'fecha',fija:1},{campo:'v',titulo:'Vencida',tipo:'texto',fija:1},{campo:'rp',titulo:'Reprogramaciones',tipo:'entero',fija:1},{campo:'rv',titulo:'Revisar',tipo:'texto'},{campo:'ev',titulo:'Archivos de evidencia',tipo:'entero',fija:1},
      {campo:'sa',titulo:'Situación antes',tipo:'texto'},{campo:'co',titulo:'Comentarios',tipo:'texto'},{campo:'rs',titulo:'Resultado',tipo:'texto'},{campo:'im',titulo:'Impacto',tipo:'texto'},{campo:'at',titulo:'Ahorro de tiempo',tipo:'texto'},{campo:'am',titulo:'Ahorro (monto)',tipo:'texto'},
      {campo:'fr',titulo:'Fecha de registro',tipo:'fecha'},{campo:'fa',titulo:'Última actualización',tipo:'fecha'},{campo:'ap',titulo:'Actualizado por',tipo:'texto'}];
    return libro({titulo:'Tablero Círculo de Mejoras',sub:lbl,formula:'Avance = suma de los avances de cada idea ÷ número de ideas (nunca promedio de porcentajes). Meta declarada: '+META+'% de avance.',origen:'Tablero Círculo de Mejoras',resumen:res,
      detalle:{columnas:sinVacias(cd,det),filas:det,congelarCols:2,nota:'Una fila por idea de mejora del ámbito elegido.'}});
  }
};

/* --- Potenciales de Planta --- */
var POT={
  detecta:function(){return typeof personas==='function'&&typeof filasArea==='function'&&typeof comparaSemana==='function'&&typeof ST!=='undefined'&&typeof INFO!=='undefined';},
  pone:function(){boton(document.querySelector('#bar button[onclick*="print"]'),true,'btn',POT.exporta);},
  det:function(rows){
    var cols=[{campo:'y',titulo:'Año',tipo:'entero',fija:1},{campo:'s',titulo:'Semana',tipo:'entero',fija:1},{campo:'a',titulo:'Área',tipo:'texto',fija:1},{campo:'c',titulo:'Código',tipo:'alfanumerico',fija:1},{campo:'n',titulo:'Nombre',tipo:'texto',fija:1},{campo:'k',titulo:'Cat',tipo:'alfanumerico'},
      {campo:'g',titulo:'Línea / proceso',tipo:'alfanumerico'},{campo:'o',titulo:'Ocupación',tipo:'texto'},{campo:'op',titulo:'Cód. operación',tipo:'alfanumerico'},{campo:'on',titulo:'Operación',tipo:'texto'},{campo:'m',titulo:'Máquina',tipo:'alfanumerico'},
      {campo:'d',titulo:'Dificultad',tipo:'alfanumerico'},{campo:'t',titulo:'TSD (min)',tipo:'decimal'},{campo:'gr',titulo:'Grupo / pedido',tipo:'alfanumerico'},{campo:'e',titulo:'Estilo',tipo:'alfanumerico'},{campo:'te',titulo:'Tela',tipo:'alfanumerico'},{campo:'p',titulo:'Potencial',tipo:'porcentaje',fija:1}];
    var t=function(v){return vacio(v)?null:v;};
    var filas=rows.slice().sort(function(x,z){return (x.y*100+x.s)-(z.y*100+z.s)||String(x.a).localeCompare(String(z.a))||String(x.g).localeCompare(String(z.g))||String(x.n).localeCompare(String(z.n));})
      .map(function(r){return {y:r.y,s:r.s,a:INFO[r.a]?INFO[r.a].nom:r.a,c:t(r.c),n:t(r.n),k:t(r.k),g:t(r.g),o:t(r.o),op:t(r.op),on:t(r.on),m:t(r.m),d:t(r.d),t:r.t,gr:t(r.gr),e:t(r.e),te:t(r.te),p:fr(r.p)};});
    return {columnas:sinVacias(cols,filas),filas:filas,congelarCols:5,nota:'Una fila por medición, tal como se subió al sistema. Potencial en % de habilidad.'};
  },
  lista:function(rows,keyf,titulo,etq,ord){
    var l=lista(rows,keyf,ord);
    return {titulo:titulo,columnas:[{campo:'k',titulo:etq,tipo:'alfanumerico'},{campo:'p',titulo:'Potencial promedio',tipo:'porcentaje'},{campo:'n',titulo:'Mediciones',tipo:'entero'},{campo:'b',titulo:'Muestra',tipo:'texto'}],
      filas:l.map(function(x){return {k:vacio(x.k)?'(sin dato)':String(x.k),p:fr(x.p),n:x.n,b:x.low?'Muestra baja':null};})};
  },
  exporta:function(){
    if(!DATA||!DATA.length)throw new Error('el tablero todavía está cargando los datos');
    var nota='Potencial promedio = suma de los potenciales medidos ÷ número de mediciones (igual que la tabla dinámica del archivo POTENCIALES). No hay meta fijada.';
    var sl=function(k,multi){return 'S'+(k%100)+(multi?' · '+Math.floor(k/100):'');};
    if(ST.area==='PLANTA'){
      var fil=[],detR=[];
      AREAS.forEach(function(a){var rows=filasArea(a,''),ws=semanas(a);if(!ws.length)return;var last=ws[ws.length-1],c=comparaSemana(a,rows,last);
        fil.push({a:INFO[a].nom,s:sl(last,true),p:c.cur?fr(c.cur.p):null,n:c.cur?c.cur.n:null,sp:c.prevK!=null?sl(c.prevK,true):null,pp:c.prev?fr(c.prev.p):null,d:c.d==null?null:c.d});
        rows.forEach(function(r){if(wk(r)===last)detR.push(r);});});
      return libro({titulo:'Potenciales de Planta',sub:'Planta · última semana de cada área',formula:nota,origen:'Potenciales de Planta',
        resumen:[{titulo:'Última semana de cada área',nota:'Cada área se compara con su propia semana anterior. Los niveles de cada área no son comparables entre sí (Costura mide por operación; Corte y Acabados, por persona y semana).',
          columnas:[{campo:'a',titulo:'Área',tipo:'texto'},{campo:'s',titulo:'Última semana',tipo:'texto'},{campo:'p',titulo:'Potencial promedio',tipo:'porcentaje'},{campo:'n',titulo:'Mediciones',tipo:'entero'},{campo:'sp',titulo:'Semana anterior',tipo:'texto'},{campo:'pp',titulo:'Potencial semana anterior',tipo:'porcentaje'},{campo:'d',titulo:'Diferencia (puntos)',tipo:'decimal'}],filas:fil}],
        detalle:POT.det(detR)});
    }
    var a=ST.area,I=INFO[a],multi=multiAnio(a),rowsA=filasArea(a,ST.grupo),semk=ST.sem[a];
    var wsA=semanas(a).filter(function(w){return rowsA.some(function(r){return wk(r)===w;});});
    var rows=filasPeriodo(rowsA,ST.modo,semk);
    var per=ST.modo==='sem'?('Semana '+(semk%100)+' · '+Math.floor(semk/100)):('Acumulado '+(wsA.length?sl(wsA[0],multi)+' a '+sl(wsA[wsA.length-1],multi):''));
    var lbl=I.nom+' · '+per+(ST.grupo?' · '+I.grupo+' '+ST.grupo:'');
    if(!rows.length)throw new Error('no hay mediciones en '+per);
    var tot=prom(rows),pers=personas(rows,ST.modo),R=calcRef(pers,tot.p);
    var est=function(x){if(x.low)return 'Muestra baja';if(!R)return 'Sin referencia';if(x.p>=R.m+R.sd)return 'Sobre el promedio';if(x.p<=R.m-R.sd)return 'Bajo el promedio';return 'En el promedio';};
    var bajo=pers.filter(function(x){return est(x)==='Bajo el promedio';}).length;
    var c=ST.modo==='sem'?comparaSemana(a,rowsA,semk):null;
    var fi0={p:fr(tot.p),n:tot.n,pe:pers.length,sp:c&&c.prevK!=null?sl(c.prevK,multi):null,pp:c&&c.prev?fr(c.prev.p):null,d:c&&c.d!=null?c.d:null,b:R?bajo:null,rm:R?fr(R.m):null,rs:R?R.sd:null};
    var res=[{titulo:'Indicadores — '+lbl,nota:nota,
      columnas:[{campo:'p',titulo:'Potencial promedio',tipo:'porcentaje'},{campo:'n',titulo:'Mediciones',tipo:'entero'},{campo:'pe',titulo:'Personas medidas',tipo:'entero'},{campo:'sp',titulo:'Semana anterior',tipo:'texto'},{campo:'pp',titulo:'Potencial semana anterior',tipo:'porcentaje'},{campo:'d',titulo:'Diferencia (puntos)',tipo:'decimal'},
        {campo:'b',titulo:'Personas bajo el promedio',tipo:'entero'},{campo:'rm',titulo:'Promedio de referencia',tipo:'porcentaje'},{campo:'rs',titulo:'Desviación típica (puntos)',tipo:'decimal'}],
      filas:[fi0]}];
    res[0].columnas=sinVacias(res[0].columnas,[fi0]);
    var ser=serieSemanal(rowsA,wsA);
    res.push({titulo:'Potencial semana a semana — '+(ST.grupo?I.grupo+' '+ST.grupo:I.nom),nota:'Promedio simple de las mediciones de cada semana. Muestra baja = menos de '+CFG.MIN_GRUPO.sem+' mediciones.',
      columnas:[{campo:'s',titulo:'Semana',tipo:'texto'},{campo:'p',titulo:'Potencial promedio',tipo:'porcentaje'},{campo:'n',titulo:'Mediciones',tipo:'entero'},{campo:'b',titulo:'Muestra',tipo:'texto'}],
      filas:wsA.map(function(w,i){var q=ser[i];return {s:sl(w,multi),p:q?fr(q.p):null,n:q?q.n:null,b:q&&q.n<CFG.MIN_GRUPO.sem?'Muestra baja':null};})});
    if(!ST.grupo)res.push(POT.lista(rows,function(r){return r.g;},'Por '+I.grupo.toLowerCase(),I.grupo));
    var ps=pers.slice().sort(function(x,y){return (x.low-y.low)||(y.p-x.p);});
    var cp=[{campo:'nom',titulo:'Persona',tipo:'texto'},{campo:'c',titulo:'Código',tipo:'alfanumerico'},{campo:'k',titulo:'Cat',tipo:'alfanumerico'},{campo:'g',titulo:I.grupo,tipo:'alfanumerico'}];
    if(a!=='COSTURA')cp.push({campo:'o',titulo:'Ocupación',tipo:'texto'});
    cp=cp.concat([{campo:'n',titulo:'Mediciones',tipo:'entero'},{campo:'p',titulo:'Potencial promedio',tipo:'porcentaje'},{campo:'e',titulo:'Estado',tipo:'texto'}]);
    if(a==='COSTURA')cp.push({campo:'mq',titulo:'Por máquina',tipo:'texto'});
    res.push({titulo:'Por persona',nota:'Estado = comparación con el promedio del área'+(R?' ('+R.m.toFixed(1)+'% ± '+R.sd.toFixed(1)+' puntos)':'')+(minP()>1?'. Muestra baja = menos de '+minP()+' mediciones en el período.':'.'),
      columnas:cp,filas:ps.map(function(x){return {nom:x.nom,c:x.c,k:vacio(x.k)?null:x.k,g:vacio(x.g)?null:x.g,o:vacio(x.o)?null:x.o,n:x.n,p:fr(x.p),e:est(x),

    var lbl=plabel+(CURCLI?' · Cliente '+CURCLI:''),pc=function(a,b){return b?a/b:null;};
    var nota='% de segundas = prendas de segunda ÷ prendas despachadas del período (reporte semanal). Meta declarada en el tablero: '+META+'%.'+(CURCLI?' El filtro de cliente se aplica a las secciones por motivo, área, cliente y estilo; el indicador es del período completo, igual que en pantalla.':'');
    var aY=acumY(Y);
    var ind=[{k:'Período · '+plabel,c:conf.conf,s:conf.seg,p:pc(conf.seg,conf.conf),m:META/100}];
    if(!isYear)ind.push({k:'Acumulado '+Y,c:aY.conf,s:aY.seg,p:pc(aY.seg,aY.conf),m:META/100});
    var res=[{titulo:'% de segundas — '+lbl,nota:nota,columnas:[{campo:'k',titulo:'Ámbito',tipo:'texto'},{campo:'c',titulo:'Prendas despachadas',tipo:'entero'},{campo:'s',titulo:'Prendas de segunda',tipo:'entero'},{campo:'p',titulo:'% de segundas',tipo:'porcentaje'},{campo:'m',titulo:'Meta',tipo:'porcentaje'}],filas:ind}];
    var tot=dr.reduce(function(s,r){return s+r.cant;},0);
    var grp=function(key,tt,et){return {titulo:tt,nota:'% = prendas de segunda del grupo ÷ '+tot+' prendas de segunda del detalle'+(CURCLI?' del cliente':'')+'.',
      columnas:[{campo:'k',titulo:et,tipo:'texto'},{campo:'v',titulo:'Prendas de segunda',tipo:'entero'},{campo:'p',titulo:'% del total',tipo:'porcentaje'}],
      filas:groupSum(dr,key).map(function(x){return {k:String(x.k),v:x.v,p:pc(x.v,tot)};})};};
    res.push(grp('mot','Por motivo','Motivo'));res.push(grp('area','Por área generadora','Área'));res.push(grp('cli','Por cliente','Cliente'));res.push(grp('est','Por estilo','Estilo'));
    var t=function(x){return vacio(x)?null:String(x);};
    var det=dr.map(function(r){return {y:r.year,s:r.sem||null,m:(r.mcal!=null&&typeof MESES!=='undefined')?MESES[r.mcal]:null,cl:t(r.cli),g:t(r.grp),e:t(r.est),a:t(r.area),mo:t(r.mot),c:r.cant};})
      .sort(function(a,b){return (a.s||0)-(b.s||0);});
    var cd=[{campo:'y',titulo:'Año',tipo:'entero'},{campo:'s',titulo:'Semana',tipo:'entero'},{campo:'m',titulo:'Mes',tipo:'texto'},{campo:'cl',titulo:'Cliente',tipo:'texto',fija:1},{campo:'g',titulo:'Grupo',tipo:'alfanumerico'},{campo:'e',titulo:'Estilo',tipo:'alfanumerico',fija:1},
      {campo:'a',titulo:'Área generadora',tipo:'texto'},{campo:'mo',titulo:'Motivo de segunda',tipo:'texto',fija:1},{campo:'c',titulo:'Cantidad',tipo:'entero',fija:1}];
    return libro({titulo:'Segundas · Interno',sub:lbl,formula:nota,origen:'Segundas · Interno',resumen:res,
      detalle:{columnas:sinVacias(cd,det),filas:det,congelarCols:3,nota:'Una fila por registro de segundas del período'+(CURCLI?' y del cliente elegido':'')+'.'}});
  }
};

var ADAPT=[CAL,IFC,CHK,MEJ,POT,COR,ATX,CMU,PCO,WIP,AVI,AAU,CDA,SPO,VFT,FTH,TPR,SGV];
prepararXLSX();
function iniciar(){var hay=false;ADAPT.forEach(function(a){try{if(a.detecta()){hay=true;a.pone();}}catch(e){}});if(hay)vigilar();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',iniciar);else iniciar();
window.addEventListener('load',iniciar);
}catch(e){}})();
</script>
