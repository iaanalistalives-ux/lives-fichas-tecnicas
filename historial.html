<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVES — Mediciones realizadas</title>
<style>
:root{
  --petrol:#0E3B36; --emer:#10B981; --sage:#0F7A5A; --sage-dark:#0B815E;
  --slate:#4E6B78; --rose:#DC2626; --tan:#F59E0B;
  --warm:#DCE5E2; --warm-light:#F1F6F4; --stone:#5F726C;
}
*{box-sizing:border-box;}
html,body{max-width:100%;}
body{margin:0;background:var(--warm-light);color:#333;font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.4;}
.header{background:var(--petrol);border-bottom:3px solid var(--emer);min-height:76px;display:flex;align-items:center;padding:14px 18px;gap:14px;flex-wrap:wrap;}
.header img{height:36px;display:block;}
.divider{width:1px;height:32px;background:rgba(255,255,255,.35);}
.htitle{color:#fff;font-size:16px;font-weight:700;}
.hsub{color:#F1F6F4;font-size:11.5px;}
.volver{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:9px 15px;cursor:pointer;white-space:nowrap;}
.wrap{padding:16px 18px 50px;}

#acceso{position:fixed;inset:0;background:var(--warm-light);z-index:120;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
#acceso .cajaAcc{background:#fff;border:1px solid var(--warm);border-radius:12px;padding:26px;max-width:410px;width:100%;}
#acceso .logoAcc{background:var(--petrol);border-bottom:3px solid var(--emer);border-radius:8px;padding:16px;text-align:center;margin:-26px -26px 20px;border-radius:12px 12px 0 0;}
#acceso .logoAcc img{height:34px;}
#acceso h2{font-size:19px;margin:0 0 3px;}
#acceso .subAcc{font-size:12.5px;color:var(--stone);margin:0 0 16px;}
#acceso .aerr{display:none;background:#FBE9E9;border:1px solid var(--rose);border-radius:6px;padding:10px 12px;color:#DC2626;font-size:12.5px;margin-bottom:12px;}
#acceso .legAcc{font-size:11px;color:var(--stone);margin-top:13px;text-align:center;line-height:1.5;}
.panel{background:#fff;border:1px solid var(--warm);border-radius:8px;padding:14px 16px;margin-bottom:16px;}
.panel .pt{font-size:15px;font-weight:700;color:#333;}
.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:10px;}
.lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--stone);margin-bottom:5px;}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
input.txt,select.txt{width:100%;font-family:inherit;font-size:15px;padding:10px;border:1.5px solid var(--warm);border-radius:6px;background:#fff;}
input.txt:focus,select.txt:focus{outline:none;border-color:var(--sage);}
.btn{background:var(--sage);color:#fff;font-weight:700;font-family:inherit;font-size:13.5px;border:none;border-radius:6px;padding:10px 18px;cursor:pointer;}
.btn:hover{background:var(--sage-dark);}
.btn.ghost{background:#fff;border:1px solid var(--warm);color:var(--sage);}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
.err{display:none;background:#FBE9E9;border:1px solid var(--rose);border-radius:8px;padding:12px 16px;color:#DC2626;font-size:13px;margin-bottom:16px;}

.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--warm);border-radius:8px;padding:13px 15px;flex:1;min-width:110px;}
.kpi .v{font-size:25px;font-weight:700;color:var(--sage);line-height:1.1;}
.kpi .l{font-size:12px;color:#333;font-weight:600;margin-top:3px;}
.kpi.mal .v{color:var(--rose);}

.fila{background:#fff;border:1px solid var(--warm);border-left:4px solid var(--sage);border-radius:8px;padding:12px 14px;margin-bottom:9px;cursor:pointer;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.fila.rech{border-left-color:var(--rose);}
.fila .est{font-size:17px;font-weight:800;min-width:62px;}
.fila .inf{flex:1;min-width:0;font-size:12.5px;color:var(--stone);overflow-wrap:anywhere;}
.fila .inf b{color:#333;}
.fila .res{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;white-space:nowrap;}
.res.ap{background:#ECFDF5;color:#065F46;border:1px solid var(--emer);}
.res.re{background:#FEF2F2;color:#991B1B;border:1px solid var(--rose);}
.vacio{background:#fff;border:1px dashed var(--warm);border-radius:8px;padding:28px 20px;text-align:center;color:var(--stone);font-size:13.5px;}
.cargando{text-align:center;padding:34px;color:var(--stone);font-size:13.5px;}
.sectitle{font-size:16px;font-weight:700;color:var(--sage-dark);margin:20px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--warm);}

/* ---- membrete (solo al imprimir) ---- */
#membrete{display:none;align-items:center;gap:16px;padding:0 0 10px;border-bottom:2px solid #0E3B36;margin-bottom:14px;}
#membrete img{height:40px;}
#membrete .mt{font-size:15px;font-weight:800;color:#0E3B36;letter-spacing:.3px;}
#membrete .ms{font-size:12px;color:#444;margin-top:2px;}
#membrete .mfec{margin-left:auto;font-size:11px;color:#555;text-align:right;}

@media print{
  @page{ size:A4 portrait; margin:12mm; }
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  body{ background:#fff!important; font-size:11px; }
  .header,.wrap,#det .top,.volver{ display:none!important; }
  #det{ position:static!important; display:block!important; background:#fff!important; overflow:visible!important; }
  #det .cuerpo{ padding:0!important; }
  #membrete{ display:flex!important; }
  .panel{ border:1px solid #999!important; box-shadow:none!important; break-inside:avoid; page-break-inside:avoid; margin-bottom:10px!important; }
  table{ min-width:0!important; font-size:10px; break-inside:auto; }
  th,td{ border:1px solid #999!important; padding:3px 5px!important; }
  th{ background:#EEE!important; }
  td.cod{ background:#F5F5F5!important; }
  td.dif.mal{ background:#FFE4E4!important; color:#B00!important; }
  tr{ break-inside:avoid; page-break-inside:avoid; }
  thead{ display:table-header-group; }
  .tallaTit{ break-after:avoid; page-break-after:avoid; margin-top:10px!important; }
  .tw{ overflow:visible!important; }
  .leyenda{ font-size:9px; }
  .firmas{ display:flex!important; }
  .soloweb{ display:none!important; }
  #acceso{ display:none!important; }
}
.firmas{display:none;gap:40px;margin-top:26px;padding-top:6px;}
.firmas div{flex:1;border-top:1px solid #666;padding-top:5px;font-size:10px;color:#333;text-align:center;}

/* ---- visor de la ficha ---- */












/* ---- ficha de detalle ---- */
#det{position:fixed;inset:0;background:var(--warm-light);z-index:60;display:none;overflow-y:auto;}
#det .top{background:var(--petrol);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--emer);flex-wrap:wrap;}
#det .top .t{font-size:16px;font-weight:800;}
#det .top .s{font-size:11.5px;color:#CFE5DE;}
#det .top .btns{margin-left:auto;display:flex;gap:8px;}
#det .top button{background:#fff;color:var(--petrol);border:none;font-family:inherit;font-size:12.5px;font-weight:800;border-radius:6px;padding:8px 15px;cursor:pointer;}
#det .top button.alt{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;}
#det .cuerpo{padding:16px 18px 50px;}
.cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 16px;font-size:12.5px;}
.cab div span{color:var(--stone);}
.cab div b{color:#333;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px;}
th,td{border:1px solid var(--warm);padding:6px 8px;text-align:center;}
th{background:var(--warm-light);color:var(--stone);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
td.cod{font-weight:800;background:var(--warm-light);width:46px;}
td.desc{text-align:left;font-size:11.5px;color:var(--stone);min-width:190px;}
td.esp{font-weight:700;}
td.tol{color:var(--slate);}
td.dif{font-weight:800;}
td.dif.ok{color:var(--sage);}
td.dif.mal{color:var(--rose);background:#FEF2F2;}
td.nada{color:#C8D3CF;}
.tallaTit{font-size:14px;font-weight:800;color:var(--sage-dark);margin:18px 0 8px;}
.leyenda{font-size:11.5px;color:var(--stone);margin-top:8px;}
</style>
</head>

  <div class="divider"></div>
  <div>
    <div class="htitle">MEDICIONES REALIZADAS</div>
    <div class="hsub">Hojas de medidas llenadas por las auditoras</div>
  </div>

<div class="wrap" id="app">

      <div><span class="lbl">Hasta</span><input class="txt" type="date" id="fHasta"></div>
    </div>
    <div class="acciones">
      <button class="btn" onclick="buscar()">Buscar</button>
      <button class="btn ghost" onclick="limpiar()">Limpiar</button>
      <span id="sync" style="font-size:11.5px;color:var(--stone);"></span>
    </div>
  </div>

  <div class="kpis" id="kpis" style="display:none;"></div>
  <div id="salida"><div class="cargando">Cargando…</div></div>
</div>

function jsonp(params, cb){
  var fn='cb_'+Math.random().toString(36).slice(2), s=document.createElement('script');
  var to=setTimeout(function(){ fin(); cb({ok:false,error:'Tiempo de espera agotado.'}); },90000);
  function fin(){ clearTimeout(to); try{delete window[fn];}catch(e){window[fn]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
  window[fn]=function(r){ fin(); cb(r); };

}
function error(m){

  e.style.display=m?'block':'none'; e.textContent=m||'';
}

/* ---------- fracciones ---------- */
function aFrac(dec){
  if(dec===null||dec===undefined||isNaN(dec)) return '—';
  var neg=dec<0; dec=Math.abs(dec);
  var ent=Math.floor(dec+1e-9), r=dec-ent, d=16, n=Math.round(r*d);
  if(n===16){ ent++; n=0; }
  var s;
  if(n===0) s=''+ent;
  else{ while(n%2===0&&d%2===0){n/=2;d/=2;} s=(ent?ent+' ':'')+n+'/'+d; }
  return (neg?'−':'')+s;
}

/* ---------- arranque ---------- */
var DESDE_BUSCADOR=false;

function paramDe(n){
  var q=location.search.replace(/^\?/,'').split('&');
  for(var i=0;i<q.length;i++){
    var p=q[i].split('=');
    if(decodeURIComponent(p[0])===n) return decodeURIComponent((p[1]||'').replace(/\+/g,' '));
  }
  return '';
}

}

function params(){
  var o={}, q=location.search.replace(/^\?/,'').split('&');
  q.forEach(function(x){
    if(!x) return;
    var p=x.split('=');
    o[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' '));
  });
  return o;
}
function limpiar(){

  var q='accion=mediciones&clave='+encodeURIComponent(SES.clave);
  [['fEstilo','estilo'],['fGrupo','grupo'],['fTaller','taller'],
   ['fAud','auditora'],['fDesde','desde'],['fHasta','hasta']].forEach(function(p){
    var v=document.getElementById(p[0]).value.trim();
    if(v) q+='&'+p[1]+'='+encodeURIComponent(v);
  });
  jsonp(q, function(r){
    if(!r || !r.ok){
      error((r&&r.error)||'No se pudo cargar.');
      document.getElementById('salida').innerHTML='<div class="vacio">Sin conexión.</div>';
      return;
    }
    error(''); MEDS=r.mediciones||[];
    pintarKpis(); pintarLista();
    document.getElementById('sync').textContent=
      'Actualizado '+new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  });
}

function pintarKpis(){
  var k=document.getElementById('kpis');
  if(!MEDS.length){ k.style.display='none'; return; }
  var rech=MEDS.filter(function(m){ return m.resultado==='RECHAZADO'; }).length;
  var medidas=MEDS.reduce(function(a,m){ return a+(+m.nMedidas||0); },0);
  var fuera=MEDS.reduce(function(a,m){ return a+(+m.nFuera||0); },0);
  var est={}; MEDS.forEach(function(m){ est[m.estilo]=1; });
  k.style.display='flex';
  k.innerHTML=
   '<div class="kpi"><div class="v">'+MEDS.length+'</div><div class="l">Auditorías</div></div>'+
   '<div class="kpi'+(rech?' mal':'')+'"><div class="v">'+rech+'</div><div class="l">Rechazadas</div></div>'+
   '<div class="kpi"><div class="v">'+Object.keys(est).length+'</div><div class="l">Estilos</div></div>'+
   '<div class="kpi"><div class="v">'+medidas+'</div><div class="l">Medidas tomadas</div></div>'+
   '<div class="kpi'+(fuera?' mal':'')+'"><div class="v">'+fuera+'</div><div class="l">Fuera de tolerancia</div></div>';
}

function pintarLista(){
  var out=document.getElementById('salida');
  if(!MEDS.length){
    out.innerHTML='<div class="vacio">No hay mediciones con esos filtros.</div>';
    return;
  }
  var dias={};
  MEDS.forEach(function(m){ (dias[String(m.fecha).slice(0,10)]=dias[String(m.fecha).slice(0,10)]||[]).push(m); });
  var h='';
  Object.keys(dias).sort().reverse().forEach(function(d){
    h+='<div class="sectitle">'+fechaLarga(d)+' — '+dias[d].length+' auditoría(s)</div>';
    dias[d].forEach(function(m){
      var re = m.resultado==='RECHAZADO';
      h+='<div class="fila'+(re?' rech':'')+'" onclick="verDetalle(\''+m.id+'\')">'+
         '<div class="est">'+m.estilo+(m.version?'<br><span style="font-size:11px;color:var(--stone);">'+m.version+'</span>':'')+'</div>'+
         '<div class="inf"><b>'+(m.grupo||'—')+'</b> · '+(m.color||'—')+
         (m.etapa?' · '+(NOM_ETAPA[m.etapa]||m.etapa):'')+
         '<br>'+(m.auditora||'—')+' · '+(m.taller||'—')+' · '+String(m.fecha).slice(11)+
         '<br>'+m.nMedidas+' medidas · '+(m.nFuera>0
             ? '<b style="color:var(--rose);">'+m.nFuera+' fuera de tolerancia</b>'
             : 'todas dentro de tolerancia')+'</div>'+
         '<div class="res '+(re?'re':'ap')+'">'+(m.resultado||'—')+'</div>'+
         '</div>';
    });
  });
  out.innerHTML=h;
}
function fechaLarga(iso){
  if(!iso) return 'Sin fecha';
  var p=iso.split('-'), m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var hoy=new Date().toISOString().slice(0,10);
  return (iso===hoy?'Hoy · ':'')+p[2]+' '+m[+p[1]-1]+' '+p[0];
}

function verDetalle(id){
  document.getElementById('dTit').textContent='Cargando…';
  document.getElementById('dSub').textContent='';
  document.getElementById('dCuerpo').innerHTML='<div class="cargando">Cargando la hoja…</div>';
  document.getElementById('det').style.display='block';
  window.scrollTo(0,0);
  jsonp('accion=medicion&clave='+encodeURIComponent(SES.clave)+'&id='+encodeURIComponent(id), function(r){
    if(!r || !r.ok || !r.medicion){
      document.getElementById('dCuerpo').innerHTML='<div class="vacio">No se pudo cargar.</div>';
      return;
    }
    pintarDetalle(r.medicion);
  });
}
function cerrarDet(){ document.getElementById('det').style.display='none'; }

function pintarDetalle(m){
  FICHA = m.fileId ? {id:m.fileId, nombre:m.archivo||'Ficha', estilo:m.estilo} : null;
  document.getElementById('btnFicha').style.display = FICHA ? 'inline-block' : 'none';
  document.getElementById('dTit').textContent = m.estilo+' · '+(m.grupo||'');
  document.getElementById('dSub').textContent =
    (NOM_ETAPA[m.etapa]||'')+(m.combo?' · '+m.combo:'')+' · '+m.auditora+' · '+m.taller;

  var puntos = (m.espec && m.espec.puntos) ? m.espec.puntos : [];
  var descDe={}, tolDe={}, espDe={};
  puntos.forEach(function(p){
    descDe[p.cod]=p.desc||'';
    tolDe[p.cod]=p.tol;
    espDe[p.cod]=p.vals;
  });

  var h='<div class="panel"><div class="pt">Datos de la auditoría</div><div class="cab">'+
    dato('Estilo',m.estilo)+dato('Grupo',m.grupo)+dato('Cliente',m.cliente)+
    dato('Color',m.color)+dato('Combo de ficha',m.combo||'—')+
    dato('Etapa',NOM_ETAPA[m.etapa]||m.etapa)+
    dato('Versión de ficha',m.version||'—')+
    dato('Auditora',m.auditora)+dato('Taller',m.taller)+dato('Fecha',m.fecha)+
    dato('Resultado',m.resultado)+
    '</div></div>';

  // agrupar por talla
  var porTalla={};
  (m.detalle||[]).forEach(function(d){ (porTalla[d.talla]=porTalla[d.talla]||[]).push(d); });
  var tallas=Object.keys(porTalla);

  if(!tallas.length){
    h+='<div class="vacio">Esta auditoría no tiene medidas registradas.</div>';
    document.getElementById('dCuerpo').innerHTML=h;
    return;
  }

  tallas.forEach(function(t){
    var dets=porTalla[t];
    var prendas=[];
    dets.forEach(function(d){ if(prendas.indexOf(d.prenda)<0) prendas.push(d.prenda); });
    prendas.sort(function(a,b){ return a-b; });

    // puntos medidos en esta talla, en el orden de la ficha
    var medidos=[];
    dets.forEach(function(d){ if(medidos.indexOf(d.cod)<0) medidos.push(d.cod); });
    var orden = puntos.map(function(p){ return p.cod; }).filter(function(c){ return medidos.indexOf(c)>=0; });
    medidos.forEach(function(c){ if(orden.indexOf(c)<0) orden.push(c); });

    var hayDesc = orden.some(function(c){ return descDe[c] && descDe[c].length>3; });

    h+='<div class="tallaTit">Talla '+t+' — '+prendas.length+' prenda(s)</div>';
    h+='<div class="panel" style="padding:12px 14px;"><div class="tw"><table><thead><tr>'+
       '<th>Cód.</th>'+(hayDesc?'<th style="text-align:left;">Descripción</th>':'')+
       '<th>Esperado</th><th>Tol. ±</th>'+
       prendas.map(function(p){ return '<th>Prenda '+p+'</th>'; }).join('')+
       '</tr></thead><tbody>';

    orden.forEach(function(cod){
      var esp = espDe[cod] ? espDe[cod][t] : null;
      var tol = tolDe[cod];
      h+='<tr><td class="cod">'+cod+'</td>';
      if(hayDesc) h+='<td class="desc">'+(descDe[cod]||'')+'</td>';
      h+='<td class="esp">'+aFrac(esp)+'</td><td class="tol">'+aFrac(tol)+'</td>';
      prendas.forEach(function(p){
        var d=dets.filter(function(x){ return x.cod===cod && x.prenda===p; })[0];
        if(!d){ h+='<td class="nada">·</td>'; return; }
        var txt = (d.difTxt && d.difTxt!=='—') ? d.difTxt : '—';
        h+='<td class="dif '+(d.ok?'ok':'mal')+'" title="Medida real: '+aFrac(d.real)+'">'+txt+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>'+
       '<div class="leyenda">Se muestra la <b>diferencia</b> respecto a la medida de ficha. '+
       '«—» es sin diferencia. En rojo, lo que se pasó de tolerancia.'+
       '<span class="soloweb"> Pasa el cursor sobre un valor para ver la medida real.</span></div></div>';
  });

  h+='<div class="firmas"><div>Auditora: '+(m.auditora||'')+'</div>'+
     '<div>Supervisor de Calidad</div><div>Jefe de Planta</div></div>';

  document.getElementById('dCuerpo').innerHTML=h;
  document.getElementById('mSub').textContent =
    'Estilo '+m.estilo+'  ·  '+(m.grupo||'')+'  ·  '+(m.cliente||'')+'  ·  '+
    (NOM_ETAPA[m.etapa]||'')+(m.combo?'  ·  '+m.combo:'')+'  ·  Resultado: '+(m.resultado||'—');
  document.getElementById('mFec').innerHTML =
    'Auditoría: '+m.fecha+'<br>Impreso: '+new Date().toLocaleString('es-PE');
}
